<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>CSS Changer</title>
  </head>
  <body>
    <div class="container">
      <h1>Change the css of below image with the help of the sliders</h1>
      <span class="heading">JS</span>
      <div class="css-controller">
        <label for="base">Base color</label>
        <input type="color" name="base" id="base" value="#ff0000" />

        <label for="width">Width</label>
        <input
          type="range"
          name="width"
          id="width"
          min="0"
          max="100"
          value="50"
          data-sizing="%" />

        <label for="border">Border radius</label>
        <input
          type="range"
          name="border-radius"
          id="border"
          min="0"
          max="100"
          value="5"
          data-sizing="px" />

        <label for="padding">Padding</label>
        <input
          type="range"
          name="padding"
          id="padding"
          min="10"
          max="200"
          value="0"
          data-sizing="px" />

        <label for="blur">Blur</label>
        <input
          type="range"
          name="blur"
          id="blur"
          min="0"
          max="25"
          value="0"
          data-sizing="px" />
      </div>
      <img src="https://cdn.pixabay.com/photo/2024/12/31/01/02/costa-rica-9301364_960_720.jpg" alt="image">
    </div>

    <script src="script.js"></script>
  </body>
</html>
